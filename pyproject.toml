[project]
name = "book-of-mormon-open-data-evid"
version = "0.1.0"
description = "EVID-001A priority evidence dossier generation"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/evid_001a/dossier_specs.py" = ["E501"]
"tests/test_evid_001a.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
